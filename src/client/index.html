<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>PicksMaps — CS2 Veto</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0f0f14;
        color: #e8e8f0;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root { min-height: 100vh; }
      .boot-msg {
        padding: 32px 20px;
        text-align: center;
        color: #a0a0b8;
        font-size: 16px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-msg">Загрузка PicksMaps…</div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        window.onerror = function (msg) {
          var root = document.getElementById("root");
          if (root) {
            root.innerHTML =
              '<div class="boot-msg" style="color:#ff6b6b">Ошибка: ' + msg + "</div>";
          }
        };
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          if (tg) {
            tg.ready();
            tg.expand();
            try {
              tg.setHeaderColor("#0f0f14");
              tg.setBackgroundColor("#0f0f14");
            } catch (e2) {}
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
