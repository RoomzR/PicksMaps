<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>PicksMaps — CS2 Veto</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      (function () {
        window.onerror = function (msg) {
          var root = document.getElementById("root");
          if (root) root.innerHTML = '<div class="boot-msg">JS: ' + msg + "</div>";
        };
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        try {
          tg.ready();
          tg.expand();
          tg.setHeaderColor("#0f0f14");
          tg.setBackgroundColor("#0f0f14");
        } catch (e) {}
      })();
    </script>
    <style>
      html, body { margin: 0; background: #0f0f14; color: #e8e8f0; font-family: system-ui, sans-serif; }
      #root { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .boot-msg { padding: 24px; text-align: center; color: #8888a0; }
    </style>
  </head>
  <body>
    <div id="root"><div class="boot-msg">Загрузка PicksMaps…</div></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
