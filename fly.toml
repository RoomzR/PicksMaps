app = 'picksmaps-bot'
primary_region = 'waw'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

# Volume опционален — без него SQLite сбрасывается при рестарте
# [[mounts]]
#   source = 'picksmaps_data'
#   destination = '/data'
